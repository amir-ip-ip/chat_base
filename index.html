<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0b0e"><meta name="color-scheme" content="dark">
<title>Duo Chat</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23111'/><text x='50' y='68' font-size='56' text-anchor='middle'>💬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0b0e;--card:rgba(30,30,35,.74);--tx:#f5f5f7;--tx2:#8e8e93;--sep:rgba(255,255,255,.09);--fill:rgba(255,255,255,.07);--acc:#3b82f6;--bub:#232328;--sh:0 12px 40px rgba(0,0,0,.55);--hi:rgba(255,255,255,.09);--ease:cubic-bezier(.2,.9,.3,1.15);--font:"Inter","Vazirmatn",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Noto Sans Arabic","Noto Naskh Arabic",Tahoma,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{font:400 16px/1.45 var(--font);letter-spacing:-.005em;-webkit-font-smoothing:antialiased;color:var(--tx);overflow-x:hidden;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(75% 42% at 50% -10%,rgba(255,255,255,.12),transparent 70%),radial-gradient(35% 25% at 100% 0,rgba(255,255,255,.04),transparent 70%)}
button,input,textarea{font-family:inherit;color:inherit}
.ic{display:inline-grid;place-items:center;line-height:0;flex:none}.ic .svg{display:block}
.screen{display:none;max-width:980px;margin:0 auto;min-height:var(--app-h,100dvh);padding:max(18px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.screen.on{display:block;animation:in .45s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.card{background:linear-gradient(180deg,rgba(255,255,255,.045),transparent 45%),var(--card);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--sep);border-radius:26px;box-shadow:var(--sh),inset 0 1px 0 var(--hi);padding:clamp(16px,4.5vw,24px)}
h1{font-size:clamp(28px,8vw,38px);letter-spacing:-.04em;margin:0 0 6px;font-weight:800;line-height:1.1;background:linear-gradient(180deg,#fff,#a1a1aa);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(18px,5vw,21px);margin:0 0 6px;letter-spacing:-.02em;font-weight:700}
p.sub{color:var(--tx2);margin:0 0 16px;font-size:15px}
.btn{appearance:none;border:0;border-radius:16px;min-height:50px;padding:0 20px;font-weight:600;font-size:16px;color:#fff;cursor:pointer;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#4a90ff,#2f6fe4);box-shadow:0 6px 18px rgba(47,111,228,.35),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .25s var(--ease),filter .2s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.96)}.btn:disabled{opacity:.4}
.btn.sec{background:var(--fill);box-shadow:none;color:var(--tx)}.btn.sm{width:auto;min-height:38px;padding:0 15px;font-size:14px;border-radius:12px}
input,textarea{font-size:16px;font-weight:500;width:100%;border-radius:14px;border:1.5px solid transparent;background:var(--fill);outline:none;transition:border-color .2s,box-shadow .2s}
input{height:50px;padding:0 16px}input:focus,textarea:focus{border-color:rgba(59,130,246,.8);box-shadow:0 0 0 4px rgba(59,130,246,.18)}
::placeholder{color:var(--tx2);opacity:.75}
:focus-visible{outline:2px solid rgba(59,130,246,.9);outline-offset:2px}
.lbl{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--tx2);margin:16px 4px 8px}
.emj{width:1.2em;height:1.2em;vertical-align:-.22em;object-fit:contain;-webkit-user-drag:none;user-select:none}
.av{--s:44px;width:var(--s);height:var(--s);border-radius:50%;background-size:cover;background-position:center;display:grid;place-items:center;flex:none;overflow:hidden;font-size:calc(var(--s)*.46);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 4px 14px rgba(0,0,0,.35);position:relative}
.av::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 45%);pointer-events:none}
.av b{font-weight:700;color:#fff;line-height:1}.av .emj{width:56%;height:56%}
.av.hd{--s:42px}.av.lg{--s:54px}.av.xl{--s:clamp(96px,32vw,136px)}
/* profile */
.hero{text-align:center;margin:clamp(8px,4vh,36px) 0 18px}
.pf{max-width:440px;margin:0 auto}
.avbig{display:block;margin:4px auto 16px;border:0;background:none;padding:0;position:relative;cursor:pointer;border-radius:50%;transition:transform .3s var(--ease)}.avbig:active{transform:scale(.95)}
.cam{position:absolute;right:2px;bottom:2px;width:38px;height:38px;border-radius:50%;background:var(--acc);display:grid;place-items:center;border:3px solid #17171b;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.bounce{animation:bnc .5s var(--ease)}@keyframes bnc{from{transform:scale(.88)}}
.seg{display:flex;background:var(--fill);padding:3px;border-radius:13px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:10px;font-size:14px;font-weight:600;color:var(--tx2);cursor:pointer;transition:all .2s}
.seg button.on{background:rgba(255,255,255,.14);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.3)}
#apanel{margin-top:14px}
.qe{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-bottom:12px}
.qe button{aspect-ratio:1;border:0;border-radius:14px;background:var(--fill);cursor:pointer;display:grid;place-items:center;font-size:24px;padding:0;transition:transform .2s var(--ease)}.qe button:hover{transform:scale(1.08)}.qe button.sel{background:rgba(255,255,255,.18);box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1;width:auto}
.cols{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.col{width:32px;height:32px;border-radius:50%;border:0;cursor:pointer;padding:0;transition:transform .25s var(--ease);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}.col.sel{box-shadow:0 0 0 3px #17171b,0 0 0 5px #fff;transform:scale(1.06)}
.hint{color:var(--tx2);font-size:13px;margin:10px 2px 0}
#go{margin-top:20px}
/* home */
.me{display:flex;align-items:center;gap:14px;margin-bottom:14px;max-width:760px;margin-left:auto;margin-right:auto}
.me>div:nth-child(2){min-width:0;flex:1}.me b{display:block;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me span{color:var(--tx2);font-size:13px}
.lobby{display:grid;gap:14px;max-width:760px;margin:0 auto}.lobby>*{animation:rise .55s var(--ease) both}.lobby>:nth-child(2){animation-delay:.07s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@media(min-width:700px){.lobby{grid-template-columns:1fr 1fr}}
.codein{text-align:center;font-size:24px;font-weight:700;letter-spacing:.35em;text-transform:uppercase;margin:12px 0;padding-left:.35em}
/* chat shell */
#s-chat{padding:0}
#s-chat.on{display:flex;flex-direction:column;position:fixed;left:50%;top:var(--vt,0px);transform:translateX(-50%);width:min(100%,820px);height:var(--app-h,100dvh);max-width:none;min-height:0;margin:0;animation:none}
@media(min-width:900px){#s-chat.on{border-left:1px solid var(--sep);border-right:1px solid var(--sep);background:rgba(11,11,14,.55)}}
.chd{display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:var(--card);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border-bottom:1px solid var(--sep);z-index:5}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:var(--fill);color:var(--tx);cursor:pointer;flex:none;display:grid;place-items:center;padding:0;transition:transform .2s var(--ease),background .2s,color .2s}.ib:active{transform:scale(.88)}.ib.on{background:rgba(255,255,255,.18)}
.who{min-width:0;flex:1}.who b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{font-size:12.5px;color:var(--tx2);display:flex;align-items:center;gap:6px}.stat i{width:7px;height:7px;border-radius:50%;background:#636366;flex:none}.stat.on i{background:#30d158;box-shadow:0 0 0 3px rgba(48,209,88,.2)}.stat.ty{color:#7db4ff}
.cc{display:flex;align-items:center;gap:6px;border:0;background:var(--fill);border-radius:99px;padding:8px 12px;font-weight:700;letter-spacing:.14em;font-size:12px;cursor:pointer;flex:none}
.body{flex:1;position:relative;min-height:0;display:flex}
.msgs{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:12px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.day{align-self:center;margin:12px 0 6px;font-size:12px;font-weight:600;color:var(--tx2);background:var(--fill);padding:3px 12px;border-radius:99px}
.sysm{align-self:center;margin:6px 0;font-size:12.5px;color:var(--tx2);text-align:center}
.m{display:flex;flex-direction:column;max-width:min(84%,560px);margin-top:2px;animation:msgin .28s var(--ease)}
.m.me{align-self:flex-end;align-items:flex-end}.m.them{align-self:flex-start;align-items:flex-start}.m.gap{margin-top:10px}
@keyframes msgin{from{opacity:0;transform:translateY(8px) scale(.96)}}
.b{position:relative;padding:7px 12px 6px;border-radius:19px;font-size:16px;font-weight:400;line-height:1.38;overflow-wrap:anywhere;word-break:break-word;cursor:pointer;transition:transform .2s;max-width:100%;min-width:64px}
.me .b{background:linear-gradient(180deg,#3d8bff,#2a69e0);color:#fff;border-bottom-right-radius:6px;box-shadow:0 2px 10px rgba(42,105,224,.28),inset 0 1px 0 rgba(255,255,255,.2)}
.them .b{background:var(--bub);border-bottom-left-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.b a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.tx{white-space:pre-wrap;unicode-bidi:plaintext;text-align:start;letter-spacing:0;font-weight:400}
.tx::after{content:"";display:block;clear:both}
.tx.big{font-size:44px;line-height:1.15}.big .emj{width:1em;height:1em}
.meta{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:400;line-height:1;opacity:.68;white-space:nowrap;direction:ltr;letter-spacing:0;font-variant-numeric:tabular-nums}
.b>.meta{display:flex;justify-content:flex-end;margin-top:3px}
.tx>.meta{float:right;margin:9px 0 -2px 14px}.tx.rtl>.meta{float:left;margin:9px 14px -2px 0}
.tk{display:inline-grid;place-items:center;line-height:0}.tk.seen{color:#a8e1ff;opacity:1}
.pi{display:block;width:min(260px,62vw);max-height:340px;object-fit:cover;border-radius:13px;margin:2px 0 4px;cursor:zoom-in;background:var(--fill)}
.rq{border-left:3px solid currentColor;background:rgba(255,255,255,.1);border-radius:8px;padding:4px 8px;margin:2px 0 6px;font-size:13px;cursor:pointer;opacity:.92;max-width:100%}.rq b{display:block;font-size:12px}.rq span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:min(220px,56vw);unicode-bidi:plaintext}
.m.del .b{font-style:italic;opacity:.65;background:var(--fill);color:var(--tx);box-shadow:none;cursor:default;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.m.del .b>.meta{flex:1 0 100%}
.rxs{display:flex;gap:4px;margin:-7px 8px 0;z-index:1;flex-wrap:wrap}.rxs:empty{display:none}
.m:has(.rxs:not(:empty)){margin-bottom:10px}
.rxc{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--sep);background:#2a2a30;border-radius:99px;padding:1px 8px;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35);animation:msgin .3s var(--ease)}
.rxc.mine{border-color:rgba(59,130,246,.9);background:#1d2b46}
.m.hl .b{animation:hl 1.2s}@keyframes hl{30%{filter:brightness(1.5)}}
.empty{position:absolute;inset:0;display:grid;place-items:center;padding:16px;overflow:auto}
.empty .card{max-width:360px;width:100%;text-align:center}
.rings{position:relative;width:104px;height:104px;margin:0 auto 14px;display:grid;place-items:center;color:var(--tx)}
.rings span.r{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);opacity:0;animation:ring 3s ease-out infinite}.rings span.r:nth-child(2){animation-delay:1s}.rings span.r:nth-child(3){animation-delay:2s}
@keyframes ring{from{transform:scale(.45);opacity:.6}to{transform:scale(1.15);opacity:0}}
.bigcode{font-size:clamp(32px,10vw,42px);font-weight:800;letter-spacing:.2em;margin:4px 0 16px;padding-left:.2em;background:linear-gradient(180deg,#fff,#8e8e93);-webkit-background-clip:text;background-clip:text;color:transparent}
.down{position:absolute;right:14px;bottom:12px;width:42px;height:42px;border-radius:50%;border:1px solid var(--sep);background:var(--card);backdrop-filter:blur(16px);box-shadow:var(--sh);color:var(--tx);cursor:pointer;z-index:4;display:grid;place-items:center}
.down s{position:absolute;top:-6px;right:-6px;background:#ff453a;color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;text-decoration:none}
/* composer (Telegram-style) */
.cmp{padding:8px max(8px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:var(--card);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border-top:1px solid var(--sep)}
.xbar{display:flex;align-items:center;gap:10px;padding:6px 10px;margin-bottom:8px;border-radius:14px;background:var(--fill);animation:in .25s}
.xq{flex:1;min-width:0;border-left:3px solid var(--acc);padding-left:8px}.xq b{display:block;font-size:12.5px;color:#7db4ff}.xq span{display:block;font-size:14px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;unicode-bidi:plaintext}
.xbar img{width:42px;height:42px;border-radius:10px;object-fit:cover}.xbar button{border:0;background:none;color:var(--tx2);cursor:pointer;display:grid;place-items:center;padding:6px}
.crow{display:flex;align-items:flex-end;gap:6px}
.ib.ghost{background:none;color:var(--tx2);width:44px;height:44px}.ib.ghost:active{background:var(--fill)}.ib.ghost.on{background:none;color:var(--acc)}
.fld{flex:1;min-width:0;display:flex;align-items:flex-end;background:var(--fill);border:1.5px solid transparent;border-radius:22px;transition:border-color .2s,box-shadow .2s}
.fld:focus-within{border-color:rgba(59,130,246,.7);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.fld textarea{flex:1;min-width:0;width:auto;display:block;border:0!important;box-shadow:none!important;background:none;border-radius:0;resize:none;padding:10px 4px 10px 15px;height:41px;min-height:41px;max-height:120px;font-size:16px;font-weight:400;line-height:21px;letter-spacing:0;overflow-y:auto;scrollbar-width:none;opacity:1}
.fld textarea::-webkit-scrollbar{display:none}
.fld textarea:disabled{-webkit-text-fill-color:var(--tx2);opacity:1}
.fld textarea::placeholder{opacity:.8;line-height:21px}
.fld .ib{width:41px;height:41px}
.ib.snd{width:44px;height:44px;background:var(--acc);color:#fff}.ib.snd:disabled{background:var(--fill);color:var(--tx2);opacity:1}
.epanel{margin-top:8px;height:min(36vh,280px);border-radius:16px;background:rgba(255,255,255,.05);overflow:hidden;animation:in .25s}
.pk{display:flex;flex-direction:column;height:100%;min-height:0}
.etabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--sep);overflow-x:auto;scrollbar-width:none;flex:none}.etabs button{border:0;background:none;color:var(--tx2);padding:6px 10px;border-radius:11px;cursor:pointer;flex:none;display:grid;place-items:center}.etabs button.on{background:rgba(255,255,255,.14);color:var(--tx)}
.egrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));align-content:start;padding:6px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.egrid button{aspect-ratio:1;border:0;background:none;padding:0;border-radius:12px;display:grid;place-items:center;cursor:pointer;font-size:28px;transition:background .15s}.egrid button:hover{background:var(--fill)}
.pop{animation:pop .3s var(--ease)}@keyframes pop{40%{transform:scale(1.45)}}
.ctxs{position:fixed;inset:0;z-index:49;background:rgba(0,0,0,.45);animation:in .2s}
.ctx{position:fixed;z-index:50;width:min(260px,calc(100vw - 20px));max-height:calc(100vh - 20px);overflow:auto;background:#242429;border:1px solid var(--sep);border-radius:20px;box-shadow:var(--sh);animation:msgin .25s var(--ease)}
.qr{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--sep);gap:2px}
.qr button{border:0;background:none;font-size:25px;width:34px;height:34px;border-radius:50%;cursor:pointer;transition:transform .2s var(--ease);padding:0;display:grid;place-items:center;flex:none;color:var(--tx)}.qr button:hover{transform:scale(1.25)}.qr button.on{background:rgba(255,255,255,.14)}.qr .plus{background:var(--fill)}
.ctx>button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:12px 16px;font-size:15.5px;cursor:pointer;border-top:1px solid var(--sep)}.ctx>button .ic{color:var(--tx2)}.ctx>button:first-of-type{border-top:0}.ctx>button:hover{background:var(--fill)}.ctx .red,.ctx .red .ic{color:#ff6961}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;animation:in .25s}
.ebox{width:min(480px,100%);height:min(60vh,440px);background:#1e1e23;border:1px solid var(--sep);border-radius:26px 26px 0 0;padding-bottom:env(safe-area-inset-bottom);overflow:hidden}
@media(min-width:700px){.sheet{align-items:center}.ebox{border-radius:26px}}
.lb{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:grid;place-items:center;animation:in .2s;cursor:zoom-out}.lb img{max-width:96vw;max-height:92vh;border-radius:12px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-120px);background:#2a2a30;border:1px solid var(--sep);box-shadow:var(--sh);padding:11px 18px;border-radius:99px;font-weight:600;font-size:14px;transition:transform .45s var(--ease);z-index:90;max-width:92vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
/* responsive */
@media(min-width:900px){.b{font-size:16.5px}.m{max-width:min(78%,560px)}}
@media(max-width:380px){.ib{width:38px;height:38px}.ib.ghost,.ib.snd{width:40px;height:40px}.crow{gap:3px}.cc span{display:none}.cc{padding:8px 10px}.b{font-size:15.5px}.btn{font-size:15px}.etabs button{padding:5px 7px}.m{max-width:90%}}
@media(max-height:500px){.hero{margin:4px 0 10px}.epanel{height:46vh}.avbig{margin-bottom:10px}.chd{padding-top:max(4px,env(safe-area-inset-top));padding-bottom:4px}.ib{width:38px;height:38px}}
@media(prefers-reduced-motion:reduce){*,::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section class="screen" id="s-profile">
  <div class="hero"><h1>Duo Chat</h1><p class="sub" style="margin:0">Private, instant chat for two.</p></div>
  <div class="card pf">
    <button class="avbig" id="avbig" aria-label="Choose a photo"><span id="avv"></span><span class="cam"><i class="ei" data-i="cam" data-s="18"></i></span></button>
    <label class="lbl" for="name" style="margin-top:0">Your name</label>
    <input id="name" dir="auto" maxlength="20" placeholder="What should we call you?" autocomplete="off" enterkeyhint="done">
    <div class="lbl">Profile picture</div>
    <div class="seg" id="atabs"><button data-t="p">Photo</button><button data-t="e">Emoji</button><button data-t="i">Initials</button></div>
    <div id="apanel"></div>
    <input type="file" id="f-gal" accept="image/*" hidden><input type="file" id="f-cam" accept="image/*" capture="user" hidden>
    <button class="btn" id="go">Continue</button>
  </div>
</section>

<section class="screen" id="s-home">

/* ---------- iOS-style emoji (Apple set, loaded as images) ---------- */

const EMO_RE=/(\p{Extended_Pictographic}(?:\ufe0f|\p{Emoji_Modifier})?(?:\u200d\p{Extended_Pictographic}(?:\ufe0f|\p{Emoji_Modifier})?)*|[\u{1F1E6}-\u{1F1FF}]{2}|[0-9#*]\ufe0f?\u20e3)/gu;

if(vv){vv.addEventListener('resize',sizeApp);vv.addEventListener('scroll',sizeApp)}addEventListener('resize',sizeApp);addEventListener('orientationchange',()=>setTimeout(sizeApp,250));

/* ---------- Image helpers ---------- */
function loadImg(f){return new Promise((ok,no)=>{if(!f||!f.type.startsWith('image/'))return no();const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);ok(im)};im.onerror=()=>{URL.revokeObjectURL(u);no()};im.src=u})}

/* ---------- Profile (photo-first onboarding) ---------- */
const QE=['😀','😎','🥹','😍','🤩','😴','🤓','😇','🥳','🤠','🙂','😏','🫡','🤗','🧐','😺','🌙','⭐','🔥','💎','🎧','🚀','🎮','☕','🍕','🌸','🖤','💫'];

$('#go').onclick=()=>{const n=$('#name').value.trim();if(!n)return toast('Enter your name first');me.name=n;sv('dc-me',me);enterHome();const r=new URLSearchParams(location.search).get('room');if(r){$('#jcode').value=r.toUpperCase();join(r)}};

/* ---------- Networking (PeerJS, reliable queue with acks) ---------- */
const genCode=()=>Array.from({length:6},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random()*31|0]).join('');
function reset(){clearTimeout(retryT);try{conn&&conn.close()}catch(e){}try{peer&&peer.destroy()}catch(e){}peer=conn=null;opp=null;everUp=false;tries=0;pend.clear();done.clear();msgs.clear();qid.clear();last=null;unread=0;$('#list').innerHTML='';cancelBar();$('#epanel').hidden=true;emoBtn();document.title='Duo Chat'}
function openChat(){
  $('#cct').textContent=code;$('#ecode').textContent=code;$('#e-host').hidden=!isHost;$('#e-guest').hidden=isHost;$('#empty').hidden=false;
  $('#c-av').innerHTML='';$('#c-name').textContent='Waiting…';setStat();lock();show('s-chat');

function leave(){reset();show('s-home')}
$('#back').onclick=leave;

function hostPeer(){
  peer=new Peer(PREFIX+code,{config:ICE});
  peer.on('error',e=>{if(e.type==='unavailable-id'){try{peer.destroy()}catch(_){}code=genCode();$('#cct').textContent=code;$('#ecode').textContent=code;hostPeer()}else if(e.type!=='peer-unavailable')toast('Connection problem: '+e.type)});
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('connection',c=>wire(c));
}
$('#join').onclick=()=>join($('#jcode').value);
function join(raw){const c=(raw||'').trim().toUpperCase();if(c.length<4)return toast('Enter the room code');reset();isHost=false;code=c;openChat();guestConnect()}

  clearTimeout(retryT);if(!code||isHost)return;

  }
  if(!peer.open){retry(1200);return}
  if(conn&&conn.open)return;
  conn=peer.connect(PREFIX+code,{reliable:true});wire(conn);
  const c0=conn;retryT=setTimeout(()=>{if(conn===c0&&!c0.open){try{c0.close()}catch(e){}conn=null;if(!everUp&&++tries>2){toast('Room not found. Check the code.');leave()}else guestConnect()}},9000);
}
addEventListener('online',()=>{if(!isHost&&code&&!(conn&&conn.open))retry(300)});
function wire(c){
  c.on('open',()=>c.send({t:'hello',p:{name:me.name,av:me.av},sid}));
  c.on('data',d=>onData(d,c));

  c.on('error',()=>{});

function tx(o,rel=true){if(rel){o.q=sid+':'+(++seqN);pend.set(o.q,o)}if(conn&&conn.open)conn.send(o);return o}

  const up=!!(conn&&conn.open),el=$('#c-stat'),ty=Date.now()<tyAt&&up;el.className='stat'+(up?' on':'')+(ty?' ty':'');

}
function lock(){const off=!opp;$('#ta').disabled=off;$('#send').disabled=off||!($('#ta').value.trim()||pendImg);$('#ta').placeholder=off?'Waiting for your partner…':'Message'}
const okImg=s=>typeof s==='string'&&/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(s)&&s.length<1000000;
const okId=s=>typeof s==='string'&&/^[a-z0-9]{6,16}$/.test(s);
function onData(d,c){
  if(!d||typeof d!=='object')return;
  if(d.t==='hello'){
    if(!d.p||typeof d.sid!=='string')return;
    if(isHost){
      if(conn&&conn.open&&conn!==c&&opp&&opp.sid!==d.sid){c.send({t:'full'});setTimeout(()=>{try{c.close()}catch(e){}},300);return}
      if(conn&&conn!==c){const o=conn;conn=c;try{o.close()}catch(e){}}else conn=c;
    }
    const first=!opp;opp={name:String(d.p.name||'Friend').slice(0,20),av:cleanAv(d.p.av),sid:d.sid};
    everUp=true;clearTimeout(retryT);$('#empty').hidden=true;$('#c-name').textContent=opp.name;$('#c-av').innerHTML=avH(opp.av,opp.name,'hd');
    if(first)sys(opp.name+' joined the chat');
    flush();setStat();lock();msgs.forEach(m=>{if(m.from!==myIdx())m.seenSent=false});markSeen();return;
  }
  if(d.t==='full'){toast('This room already has two people');leave();return}
  if(c!==conn)return;
  if(d.t==='a'){pend.delete(d.q);const id=qid.get(d.q);qid.delete(d.q);const m=id&&msgs.get(id);if(m&&m.st==='pend'){m.st='deliv';refresh(m)}return}
  if(d.q){const dup=done.has(d.q);c.send({t:'a',q:d.q});if(dup)return;done.add(d.q);if(done.size>3000)done.delete(done.values().next().value)}
  const m=msgs.get(d.id),peerIdx=1-myIdx();
  if(d.t==='m'){
    if(!okId(d.id)||m)return;
    const rp=d.rp&&okId(d.rp.id)?{id:d.rp.id,n:String(d.rp.n||'').slice(0,20),x:String(d.rp.x||'').slice(0,80)}:null;
    add({id:d.id,from:peerIdx,k:d.k==='i'&&okImg(d.img)?'i':'t',x:String(d.x||'').slice(0,4000),img:okImg(d.img)?d.img:null,ts:+d.ts||Date.now(),rp,ed:false,del:false,rx:['',''],st:''});
    tick(900,.07);if(document.hidden){unread++;document.title='('+unread+') Duo Chat'}markSeen();
  }
  else if(d.t==='e'){if(m&&m.from===peerIdx&&!m.del&&m.k==='t'){m.x=String(d.x||'').slice(0,4000);m.ed=true;refresh(m)}}
  else if(d.t==='d'){if(m&&m.from===peerIdx){m.del=true;m.x='';m.img=null;refresh(m)}}
  else if(d.t==='r'){const e=d.e===''?'':String(d.e);if(m&&!m.del&&(e===''||isEmo(e))){m.rx[peerIdx]=e;refresh(m);if(e)tick(1000,.06)}}
  else if(d.t==='ty'){tyAt=Date.now()+3000;setStat();clearTimeout(tyT);tyT=setTimeout(setStat,3100)}
  else if(d.t==='sn'&&Array.isArray(d.ids)){d.ids.forEach(id=>{const x=msgs.get(id);if(x&&x.from===myIdx()&&x.st!=='seen'){x.st='seen';refresh(x)}})}
}
function markSeen(){
  if(document.hidden||!conn||!conn.open||!$('#s-chat').classList.contains('on'))return;
  const ids=[];msgs.forEach(m=>{if(m.from!==myIdx()&&!m.seenSent&&!m.del){m.seenSent=true;ids.push(m.id)}});
  if(ids.length)tx({t:'sn',ids},false);
  if(unread){unread=0;document.title='Duo Chat'}
}
document.addEventListener('visibilitychange',markSeen);addEventListener('focus',markSeen);

/* ---------- Rendering ---------- */
const list=$('#list');
const fmtT=ts=>new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
function dayLabel(ts){const d=new Date(ts),n=new Date(),y=new Date(Date.now()-864e5);return d.toDateString()===n.toDateString()?'Today':d.toDateString()===y.toDateString()?'Yesterday':d.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'})}
function sys(t){const d=document.createElement('div');d.className='sysm';d.textContent=t;list.append(d);toBottom(true)}
function rich(el,txt){txt.split(/(https?:\/\/[^\s]+)/g).forEach((p,i)=>{if(i%2){const a=document.createElement('a');a.href=p;a.textContent=p;a.target='_blank';a.rel='noopener noreferrer';el.append(a)}else p.split(EMO_RE).forEach((q,j)=>{if(j%2)el.append(emj(q));else if(q)el.append(q)})})}
const onlyEmoji=s=>{const t=s.trim();return t.length>0&&t.length<=24&&t.replace(EMO_RE,'').trim()===''&&(t.match(EMO_RE)||[]).length<=3};
const RTL_RE=/[\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFF]/,LTR_RE=/[A-Za-z\u00C0-\u024F\u0370-\u03FF\u0400-\u04FF]/;
function isRtl(s){for(const ch of s){if(RTL_RE.test(ch))return true;if(LTR_RE.test(ch))return false}return false}
const CHK='<svg width="17" height="11" viewBox="0 0 17 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6l3 3 6-7.5M6.5 8.7l.6.5L14.5 1.5"/></svg>';
const CLK='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
function mkMeta(m,my){
  const meta=document.createElement('span');meta.className='meta';
  meta.append((m.ed&&!m.del?'edited · ':'')+fmtT(m.ts));
  if(my&&!m.del){const k=document.createElement('span');k.className='tk'+(m.st==='seen'?' seen':'');k.innerHTML=m.st==='pend'?CLK:CHK;meta.append(k)}
  return meta;
}
function bubble(m){
  const my=m.from===myIdx(),el=document.createElement('div');
  el.className='m '+(my?'me':'them')+(m.del?' del':'')+(m.gap?' gap':'');el.dataset.id=m.id;
  const b=document.createElement('div');b.className='b';let inl=false;
  if(m.del){b.append(icoEl('ban',16),'This message was deleted')}
  else{
    if(m.rp){const q=document.createElement('div');q.className='rq';q.dataset.rid=m.rp.id;const n=document.createElement('b');n.textContent=m.rp.n;const s=document.createElement('span');s.dir='auto';s.textContent=m.rp.x;q.append(n,s);b.append(q)}
    if(m.img){const i=document.createElement('img');i.className='pi';i.src=m.img;i.alt='Photo';b.append(i)}
    if(m.x){const big=!m.img&&!m.rp&&onlyEmoji(m.x),t=document.createElement('div');t.dir='auto';t.className='tx'+(big?' big':'')+(isRtl(m.x)?' rtl':'');rich(t,m.x);if(!big){t.append(mkMeta(m,my));inl=true}b.append(t)}
  }
  if(!inl)b.append(mkMeta(m,my));
  el.append(b);
  const rx=document.createElement('div');rx.className='rxs';
  if(!m.del){const g={};m.rx.forEach((e,i)=>{if(e){(g[e]=g[e]||{n:0,mine:false}).n++;if(i===myIdx())g[e].mine=true}});
    Object.keys(g).forEach(e=>{const c=document.createElement('button');c.className='rxc'+(g[e].mine?' mine':'');c.dataset.e=e;c.append(emj(e));if(g[e].n>1)c.append(String(g[e].n));rx.append(c)})}
  el.append(rx);return el;
}
function nearBottom(){return list.scrollHeight-list.scrollTop-list.clientHeight<140}
function toBottom(f){if(f||nearBottom())list.scrollTop=list.scrollHeight}
function add(m){
  m.gap=!last||last.from!==m.from;
  if(!last||new Date(last.ts).toDateString()!==new Date(m.ts).toDateString()){const d=document.createElement('div');d.className='day';d.textContent=dayLabel(m.ts);list.append(d);m.gap=false}
  last=m;msgs.set(m.id,m);const wasNear=nearBottom();list.append(bubble(m));
  if(m.from===myIdx()||wasNear)list.scrollTop=list.scrollHeight;else{const n=$('#dn');n.textContent=(+n.textContent||0)+1;n.hidden=false;$('#down').hidden=false}
}
function refresh(m){const old=list.querySelector('[data-id="'+m.id+'"]');if(old){const keep=nearBottom();old.replaceWith(bubble(m));if(keep)list.scrollTop=list.scrollHeight}}
list.addEventListener('scroll',()=>{if(nearBottom()){$('#down').hidden=true;$('#dn').hidden=true;$('#dn').textContent=0}else $('#down').hidden=false});
$('#down').onclick=()=>{list.scrollTop=list.scrollHeight};

/* ---------- Sending, reply, edit, delete, reactions ---------- */
const ta=$('#ta');
function snip(m){return m.del?'Deleted message':m.img&&!m.x?'📷 Photo':(m.img?'📷 ':'')+m.x.slice(0,80)}
function barUi(){
  const bar=$('#xbar'),on=!!(editId||replyTo||pendImg);bar.hidden=!on;if(!on)return;
  if(editId){$('#xt').textContent='Edit message';$('#xs').textContent=msgs.get(editId).x}
  else if(replyTo){$('#xt').textContent='Replying to '+(replyTo.from===myIdx()?'yourself':opp.name);$('#xs').textContent=snip(replyTo)}
  else{$('#xt').textContent='Photo';$('#xs').textContent='Add a caption (optional)'}
  $('#xi').hidden=!pendImg;if(pendImg)$('#xi').src=pendImg;
}
function cancelBar(keep){replyTo=null;editId=null;pendImg=null;if(!keep)ta.value='';fit();barUi();lock()}
$('#xc').onclick=()=>cancelBar(!editId);
function setReply(m){if(!m||m.del||!opp)return;editId=null;replyTo=m;barUi();ta.focus()}
function setEdit(m){editId=m.id;replyTo=null;pendImg=null;ta.value=m.x;barUi();fit();lock();ta.focus()}
function fit(){ta.style.height='41px';ta.style.height=Math.min(Math.max(ta.scrollHeight,41),120)+'px'}
function sendMsg(){
  if(!opp)return;const x=ta.value.trim();
  if(editId){const m=msgs.get(editId);if(m&&x&&x!==m.x){m.x=x;m.ed=true;refresh(m);tx({t:'e',id:m.id,x})}cancelBar();return}
  if(!x&&!pendImg)return;
  const m={id:rid(),from:myIdx(),k:pendImg?'i':'t',x,img:pendImg,ts:Date.now(),rp:replyTo?{id:replyTo.id,n:replyTo.from===myIdx()?me.name:opp.name,x:snip(replyTo)}:null,ed:false,del:false,rx:['',''],st:'pend'};
  add(m);const o=tx({t:'m',id:m.id,k:m.k,x:m.x,img:m.img,ts:m.ts,rp:m.rp});qid.set(o.q,m.id);cancelBar();tick(600,.05,.03);
}
$('#send').onclick=sendMsg;
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!matchMedia('(pointer:coarse)').matches){e.preventDefault();sendMsg()}else if(e.key==='Escape')cancelBar()});
ta.addEventListener('input',()=>{fit();lock();const n=Date.now();if(opp&&n-(ta._ty||0)>2000){ta._ty=n;tx({t:'ty'},false)}});
ta.addEventListener('focus',()=>{if(matchMedia('(pointer:coarse)').matches&&!$('#epanel').hidden){$('#epanel').hidden=true;emoBtn()}});
function delMsg(m){m.del=true;m.x='';m.img=null;refresh(m);tx({t:'d',id:m.id})}
function pushRec(e){rec=[e,...rec.filter(x=>x!==e)].slice(0,12);sv('dc-rec',rec)}
const quick=()=>[...new Set([...rec,...DEF])].slice(0,6);
function react(id,e){const m=msgs.get(id);if(!m||m.del||!opp||!isEmo(e))return;const i=myIdx();m.rx[i]=m.rx[i]===e?'':e;refresh(m);tx({t:'r',id,e:m.rx[i]});if(m.rx[i])pushRec(e)}
$('#photo').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';try{const im=await loadImg(f),d=fitData(im,1280);if(d.length>950000)return toast('Image is too large');editId=null;pendImg=d;barUi();lock();ta.focus()}catch(_){toast("Can't read that image")}};
/* message interactions */
let lpT=0,lpFired=false;
list.addEventListener('click',e=>{
  if(lpFired){lpFired=false;return}
  const c=e.target.closest('.rxc');if(c){const m=msgs.get(c.closest('.m').dataset.id);if(m)react(m.id,c.dataset.e);return}
  const q=e.target.closest('.rq');if(q){const t=list.querySelector('[data-id="'+q.dataset.rid+'"]');if(t){t.scrollIntoView({block:'center'});t.classList.remove('hl');void t.offsetWidth;t.classList.add('hl')}return}
  if(e.target.closest('a'))return;
  const im=e.target.closest('.pi');if(im){const l=document.createElement('div');l.className='lb';l.innerHTML='<img alt="">';l.firstChild.src=im.src;l.onclick=()=>l.remove();document.body.append(l);return}
  const b=e.target.closest('.b'),el=b&&b.closest('.m');if(el){const m=msgs.get(el.dataset.id);if(m&&!m.del)openMenu(m,b)}
});
list.addEventListener('contextmenu',e=>{const b=e.target.closest('.b');if(!b)return;e.preventDefault();const m=msgs.get(b.closest('.m').dataset.id);if(m&&!m.del)openMenu(m,b)});
list.addEventListener('pointerdown',e=>{const b=e.target.closest('.b');if(!b||e.pointerType==='mouse')return;lpFired=false;clearTimeout(lpT);lpT=setTimeout(()=>{const m=msgs.get(b.closest('.m').dataset.id);if(m&&!m.del){lpFired=true;openMenu(m,b);try{navigator.vibrate(10)}catch(_){}}},480)});
['pointerup','pointermove','pointercancel'].forEach(n=>list.addEventListener(n,()=>clearTimeout(lpT)));
let sw=null,sdx=0;
list.addEventListener('touchstart',e=>{const el=e.target.closest('.m:not(.del)');if(!el||e.touches.length!==1)return;sw={el,x:e.touches[0].clientX,y:e.touches[0].clientY};sdx=0},{passive:true});
list.addEventListener('touchmove',e=>{if(!sw)return;const dx=e.touches[0].clientX-sw.x,dy=e.touches[0].clientY-sw.y;if(Math.abs(dy)>26&&!sdx){sw=null;return}if(dx>8){clearTimeout(lpT);sdx=Math.min(dx,80);sw.el.firstChild.style.transform='translateX('+sdx+'px)'}},{passive:true});
list.addEventListener('touchend',()=>{if(!sw)return;sw.el.firstChild.style.transform='';if(sdx>60){const m=msgs.get(sw.el.dataset.id);if(m){setReply(m);try{navigator.vibrate(8)}catch(_){}}}sw=null;sdx=0});
function closeMenu(){document.querySelectorAll('.ctxs,.ctx').forEach(x=>x.remove())}
function openMenu(m,anchor){
  closeMenu();const my=m.from===myIdx(),i=myIdx(),sc=document.createElement('div'),d=document.createElement('div');
  sc.className='ctxs';d.className='ctx';
  const it=(a,ic,t,cls='')=>`<button data-a="${a}" class="${cls}">${icoH(ic,20)}<span>${t}</span></button>`;
  d.innerHTML='<div class="qr">'+quick().map(e=>`<button data-e="${e}" class="${m.rx[i]===e?'on':''}">${emjH(e)}</button>`).join('')+`<button data-a="more" class="plus" aria-label="More emoji">${ico('plus',18)}</button></div>`
   +it('reply','reply','Reply')+(m.x?it('copy','copy','Copy'):'')+(my&&m.k==='t'?it('edit','edit','Edit'):'')+(my?it('del','trash','Delete','red'):'');
  sc.onclick=closeMenu;
  d.onclick=ev=>{
    const b=ev.target.closest('button');if(!b)return;const a=b.dataset.a;
    if(b.dataset.e){closeMenu();react(m.id,b.dataset.e);return}
    if(a==='more'){closeMenu();openSheet(e=>react(m.id,e));return}
    if(a==='del'&&!b.dataset.sure){b.dataset.sure=1;b.querySelector('span:last-child').textContent='Tap again to delete';return}
    closeMenu();
    if(a==='reply')setReply(m);else if(a==='copy'){(navigator.clipboard?navigator.clipboard.writeText(m.x):Promise.reject()).then(()=>toast('Copied'),()=>toast("Couldn't copy"))}
    else if(a==='edit')setEdit(m);else if(a==='del'){delMsg(m);toast('Message deleted')}
  };
  document.body.append(sc,d);
  const r=anchor.getBoundingClientRect(),w=d.offsetWidth,h=d.offsetHeight;
  let top=r.top-h-8;if(top<10)top=Math.min(r.bottom+8,innerHeight-h-10);
  d.style.left=Math.max(10,Math.min(innerWidth-w-10,my?r.right-w:r.left))+'px';d.style.top=Math.max(10,top)+'px';
}
/* ---------- Emoji picker (Apple-style images, stays open for the composer) ---------- */
const R=(a,b)=>{const o=[];for(let c=a;c<=b;c++)o.push(c);return o};
const CATS=[
 ['smile',[[0x1F600,0x1F64F],[0x1F910,0x1F92F],[0x1F970,0x1F97F]]],
 ['people',[[0x1F446,0x1F450],[0x1F466,0x1F487],[0x1F590,0x1F596],[0x1F918,0x1F91F],[0x1F930,0x1F93A],[0x1F9D0,0x1F9DD]]],
 ['paw',[[0x1F400,0x1F43F],[0x1F980,0x1F9AE],[0x1F330,0x1F344],[0x1F490,0x1F492]]],
 ['food',[[0x1F345,0x1F37F],[0x1F950,0x1F96B],[0x1F32D,0x1F32F],[0x1F9C0,0x1F9C0]]],
 ['ball',[[0x1F3A0,0x1F3CA],[0x1F947,0x1F94F],[0x1F93B,0x1F93E],[0x1F380,0x1F393]]],
 ['car',[[0x1F680,0x1F6C5],[0x1F3E0,0x1F3F0],[0x1F30D,0x1F320]]],
 ['bulb',[[0x1F4A1,0x1F4FC],[0x1F507,0x1F53D]]],
 ['heart',[[0x1F493,0x1F49F],[0x1F4AF,0x1F4AF],[0x1F4A0,0x1F4A0]]]
];
const HEARTS=['❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❣️','💕','💞','💓','💗','💖','💘','💝','💯','💢','💥','💫','💦','💨','⭐','✨','⚡','☀️','🌈','☁️','❄️','✔️','❌','❓','❗','♻️','☮️','☺️','☹️','✌️','☝️','✍️'];
const ecache={};
function emojiOf(ci){
  if(ecache[ci])return ecache[ci];
  const out=[];CATS[ci][1].forEach(([a,b])=>R(a,b).forEach(c=>{if(/\p{Emoji_Presentation}/u.test(String.fromCodePoint(c))&&!(c>=0x1F3FB&&c<=0x1F3FF))out.push(String.fromCodePoint(c))}));
  return ecache[ci]=ci===7?[...HEARTS,...out.filter(e=>!HEARTS.includes(e))]:out;
}
function picker(onPick){
  const w=document.createElement('div');w.className='pk';w.innerHTML='<div class="etabs"></div><div class="egrid"></div>';
  const tabs=w.firstChild,grid=w.lastChild,all=[['clock',-1],...CATS.map((c,i)=>[c[0],i])];
  const fill=k=>{[...tabs.children].forEach(b=>b.classList.toggle('on',+b.dataset.k===k));const l=k<0?(rec.length?rec:DEF):emojiOf(k);grid.innerHTML=l.map(e=>`<button data-e="${e}"><img class="emj" loading="lazy" decoding="async" alt="${e}" draggable="false" src="${eu(e)}"></button>`).join('');grid.scrollTop=0};
  tabs.innerHTML=all.map(([ic,k])=>`<button data-k="${k}" aria-label="Category">${ico(ic,22)}</button>`).join('');
  tabs.onclick=e=>{const b=e.target.closest('button');if(b)fill(+b.dataset.k)};
  grid.onclick=e=>{const b=e.target.closest('button');if(!b)return;const em=b.dataset.e;pushRec(em);b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');onPick(em)};
  fill(rec.length?-1:0);return w;
}
function openSheet(cb){closeMenu();const s=document.createElement('div');s.className='sheet';const box=document.createElement('div');box.className='ebox';
  box.append(picker(e=>{s.remove();cb(e)}));s.append(box);s.onclick=e=>{if(e.target===s)s.remove()};document.body.append(s)}
function insertEmoji(e){const s=ta.selectionStart==null?ta.value.length:ta.selectionStart,en=ta.selectionEnd==null?s:ta.selectionEnd;if(ta.value.length+e.length>4000)return;ta.value=ta.value.slice(0,s)+e+ta.value.slice(en);const p=s+e.length;try{ta.setSelectionRange(p,p)}catch(_){}fit();lock()}
function emoBtn(){$('#emo').innerHTML=ico($('#epanel').hidden?'smile':'kbd',25);$('#emo').classList.toggle('on',!$('#epanel').hidden)}
$('#emo').onclick=()=>{const p=$('#epanel'),keep=nearBottom();if(p.hidden&&!p.firstChild)p.append(picker(insertEmoji));p.hidden=!p.hidden;emoBtn();if(!p.hidden)ta.blur();else if(!matchMedia('(pointer:coarse)').matches)ta.focus();if(keep)setTimeout(()=>list.scrollTop=list.scrollHeight,30)};

/* ---------- Invite helpers & init ---------- */
const inviteUrl=()=>location.origin+location.pathname+'?room='+code;
const copy=(t,m)=>{(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(m),()=>toast("Couldn't copy. Select it manually."))};
$('#copyc').onclick=()=>copy(code,'Code copied');$('#copyl').onclick=()=>copy(inviteUrl(),'Invite link copied');$('#ccode').onclick=()=>copy(inviteUrl(),'Invite link copied');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();document.querySelectorAll('.sheet,.lb').forEach(x=>x.remove())}});
(function(){
  hydrate();emoBtn();sizeApp();
  if(!me.name){atab='i';me.av.c=Math.random()*PAL.length|0;$('#name').value='';paintProfile();show('s-profile');return}
  enterHome();const r=new URLSearchParams(location.search).get('room');if(r){$('#jcode').value=r.toUpperCase();join(r)}
})();
